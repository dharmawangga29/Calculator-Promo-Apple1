name: Update Promo Google Sheet

on:
  schedule:
    - cron: '0 * * * *' # Menjalankan otomatis setiap 1 jam
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sync Google Sheet & Rebuild HTML
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          python scripts/sync_google_drive.py

      - name: Commit and Push Updated Data & HTML
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data.json data.json index.html public/index.html
          git diff-index --quiet HEAD || (git commit -m "auto: update promo data and rebuild index.html [skip ci]" && git push)
