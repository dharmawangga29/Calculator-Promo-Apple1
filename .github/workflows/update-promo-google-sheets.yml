name: Update Promo from Google Sheets

on:
  schedule:
    # Berjalan otomatis setiap jam
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions

permissions:
  contents: write # Izin commit & push ke repositori

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync Data from Google Sheets
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          python scripts/sync_google_sheets.py

      - name: Build Static HTML & Sync Public Directory
        run: |
          python build_static.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json index.html public/
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data dari Google Sheet."
          else
            git commit -m "auto: sync promo data from Google Sheets [skip ci]"
            git push origin main
          fi
